name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create the initial alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v0.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to publish."
            exit 0
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "local-llm-lab v0.1.0 — Initial alpha" \
            --prerelease \
            --notes-file - <<'EOF'
          ## Initial alpha release

          local-llm-lab is a zero-dependency CLI for honest local LLM deployment planning on high unified-memory Macs.

          ### Included

          - Hardware detection with privacy-preserving saved profiles
          - Memory-fit planning for model weights, KV cache, runtime overhead, and OS reserve
          - Quantization, context, and backend comparison with actionable recommendations
          - Dry-run deployment files for llama.cpp, MLX, and Ollama
          - Deterministic mock benchmarks, stress simulations, and local HTML/Markdown/JSON reports
          - A local-only report viewer and report hub

          ### Verification

          The standard-library test suite runs automatically across Python 3.10–3.13 on every push and pull request.

          ### Important

          Planning and mock-benchmark figures remain estimates unless measured using a real backend. This alpha release does not download model weights, send telemetry, or require an account.
          EOF
